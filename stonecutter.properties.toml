# THE single source of version truth for every node.
# A release edits `mod.version` here, once. Nothing else.
# Gradle-only options live in gradle.properties; everything else lives here.

mod.id = "archetypes"
mod.name = "Archetypes"
mod.group = "com.archetypes"
mod.version = "1.2.1"

deps.fabric_loader = "0.19.3"

# Skill Proficiencies is a COMPILE-ONLY soft dependency (compat/SpecialitiesBridge guards
# every touch at runtime). One artifact provably cannot serve every node — measured on the
# shipped jars, `SkillType.iconTexture()` returns `Identifier` on 26.x, `ResourceLocation`
# on the loader jars and `class_2960` on the legacy Fabric jars — so the node script picks
# the per-node jar out of `../specialities/build/libs/<this version>/`. Only the version
# number lives here; the file NAME is assembled per node (design §3.5, fallback mechanism,
# which is the one in force).
deps.specialities = "1.6.3"

# R-01, MEASURED IN THE OTHER REPO — `loomx.loom_version` must be visible to FABRIC nodes
# ONLY, hence this bare `[fabric]` table. The TOML ROOT is as dangerous as gradle.properties:
# `dev.kikugie.loom-back-compat` is a SETTINGS plugin whose `beforeProject` hook puts
# fabric-loom on the buildscript classpath of every project that has the key, which breaks
# an Architectury Loom node with "Unresolved reference: platform". Do not move it.
#
# 1.17.17, not the 1.17.13 this repo used before the workspace: the pin comes WITH the
# scaffold so both repos run one loom.
[fabric]
loomx.loom_version = "1.17.17"

["26.2"]
# Game versions this node's jar is marked compatible with on Modrinth.
mod.mc_releases = ["26.2"]

[fabric."26.2"]
mod.mc_compat = "~26.2"
mod.loader_floor = ">=0.19.3"
# Skill Proficiencies' pin for this node, adopted rather than kept at the 0.154.2+26.2 this
# repo used before the workspace. Two reasons, both measured: a cold rebuild against it is
# instruction-identical and resource-byte-identical (244/244 classes, 385/385 resources), and
# the headless smoke rig has been running 0.155.2 all along — so this closes a
# compile-vs-runtime skew rather than opening one.
deps.fabric_api = "0.155.2+26.2"
# Player Animation Library, pinned by Modrinth VERSION ID and not by version number:
# `1.1.5` is duplicated across the Fabric and NeoForge listings and only the id
# disambiguates (design §2.1, R-C5). `g8XDqDTi` is `1.2.4+mc.26.2`, a Merged jar — mojmap
# classes with NO `Fabric-Mapping-Namespace` header, which is why this node takes it
# through a PLAIN `implementation` and not `modImplementation`. Getting that backwards is a
# silent mis-remap, not a build failure.
#
# NOT moved to the design's `1.2.5` / `OQqtEQC6`, and that is a deliberate hold rather than
# an oversight: 1.2.4 is what the dev run directory, the headless smoke rig and every
# Stage-0 measurement use, and `depends: player_animation_library "*"` means compiling
# against a newer artifact than the one the client actually loads buys a NoSuchMethodError
# risk for nothing. The R-C5 requirement is that the coordinate be an ID, and it is. Moving
# the number is a deps-lane call, made with the runtime updated in the same breath.
deps.pal = "g8XDqDTi"

["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

[fabric."26.1"]
mod.mc_compat = "~26.1"
mod.loader_floor = ">=0.19.3"
deps.fabric_api = "0.154.2+26.1.2"
# `1.2.5` for MC 26.1, a Merged jar exactly like 26.2's — so still a plain `implementation`,
# no dependency-configuration fork at this boundary. The version NUMBER differs from 26.2's
# 1.2.4 because PAL published no 1.2.4 for 26.1, and that asymmetry is safe rather than
# assumed: all six PAL types this repo imports — IAnimatedAvatar, PlayerAnimationController,
# PlayerAnimationFactory, FirstPersonConfiguration, FirstPersonMode, PlayState — are
# signature-identical between the two jars (`javap -p`, measured on both).
deps.pal = "SdKAeB6x"

["1.21.11"]
mod.mc_releases = ["1.21.11"]

[fabric."1.21.11"]
mod.mc_compat = "1.21.11"
# Skill Proficiencies' floor for this node, adopted rather than re-derived, and it is NOT
# `>=0.19.3`: fabric-api 0.141.5 already demands loader 0.17.3, and 0.17.3 bundles
# MixinExtras 0.5.0. That matters more here than it does next door — this repo has 18
# MixinExtras injectors (2 `@WrapMethod`, 3 `@ModifyExpressionValue`, 5 `@WrapOperation`,
# 8 `@ModifyReturnValue`), and `@WrapMethod` needs >=0.4.0. Below that floor the failure is
# a cryptic mixin-apply crash, not a version message.
mod.loader_floor = ">=0.17.3"
deps.fabric_api = "0.141.5+1.21.11"
# `1.1.9` for MC 1.21.11 — and THE FIRST NODE WHERE THE DEPENDENCY CONFIGURATION FORKS.
# This is a Fabric jar, not a Merged one: its manifest declares
# `Fabric-Mapping-Namespace: intermediary` (checked), so Loom must remap it and the node
# script puts it through `modImplementation`. Putting a 26.x Merged jar (mojmap, no header)
# through the same configuration would have Loom remap it as if it were intermediary — a
# silent mis-remap, not a build failure (design §2.1 / R-C5).
#
# No SOURCE fork, and that is measured rather than assumed: `javap -p` on this jar and on
# 26.1's SdKAeB6x shows all six imported types — IAnimatedAvatar, PlayerAnimationController,
# PlayerAnimationFactory, FirstPersonConfiguration, FirstPersonMode, PlayState —
# signature-identical INCLUDING return types (`setFirstPersonMode`/`setFirstPersonConfiguration`
# return the controller on both). The only difference is the namespace the MC types are
# spelled in (`class_11890` here vs `Avatar` there), which is exactly what the remap fixes.
# The 1.1.x/1.2.x API split the design warns about starts one node lower, at 1.21.1's 1.1.5.
deps.pal = "BXYewCJb"

["1.21.1"]
# Skill Proficiencies' claim for this node, adopted rather than re-derived so a player on
# 1.21 does not end up able to install one half of the pair and not the other. Stated with
# its provenance rather than as a measurement: the headless smoke and every gate in Stage 4
# ran on 1.21.1, and 1.21 is covered because the mod's whole surface — 20 mixin targets, the
# item/tag/recipe set, the damage funnel — is identical between the two, 1.21.1 being a
# bugfix release. If a 1.21-only report ever arrives, narrow this key, not the node.
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
# NOT fabric-api's own floor, and this is the one node in the range where that distinction
# is a real finding rather than boilerplate — Skill Proficiencies measured it and it binds
# here for a stronger reason. Every module of fabric-api 0.116.14+1.21.1 declares only
# `fabricloader >=0.15.11`, which BUNDLES MixinExtras 0.3.5. Loader bundles MixinExtras
# (0.15.11 -> 0.3.5, 0.16.3 -> 0.4.1, 0.17.3 -> 0.5.0, 0.19.3 -> 0.5.4) and this repo has
# 18 MixinExtras injectors including one `@WrapMethod` (HealOrHarmMobEffectMixin), which
# needs >= 0.4.0 and does not exist at all in 0.3.5. Taking fabric-api's floor would turn
# "update your loader" into a cryptic mixin-apply crash at boot. >=0.16.3 is the lowest
# loader that bundles a MixinExtras with `@WrapMethod`.
#
# Equally: do NOT copy the 26.x nodes' `>=0.19.3` downward — it locks out this node's whole
# audience for nothing.
mod.loader_floor = ">=0.16.3"
deps.fabric_api = "0.116.14+1.21.1"
# `1.1.5` for MC 1.21.1 — and THE FIRST NODE WHERE PAL'S API FORKS AT SOURCE LEVEL. The
# dependency CONFIGURATION does not fork again: this is a Fabric jar declaring
# `Fabric-Mapping-Namespace: intermediary` (read out of its MANIFEST.MF, not assumed), the
# same as 1.21.11's BXYewCJb, so `modImplementation` carries over unchanged from Stage 3.
#
# The version ID and not the number, and here that is not a formality: `1.1.5` is published
# on BOTH the Fabric and the NeoForge listing of `player-animation-library`, and only the id
# tells them apart — `FkO8Scek` is Fabric, `ReDTdA0C` is NeoForge (design R-C5). The
# NeoForge one is Stage 6's, on the sibling node at the same MC version.
#
# The source fork it brings, measured with `javap -p` on this jar against 1.21.11's:
#   IAnimatedAvatar        -> IAnimatedPlayer
#   PlayerAnimationController(Avatar, …)  -> (AbstractClientPlayer, …)
#   PlayerAnimationFactory…registerFactory's lambda takes AbstractClientPlayer
# Unchanged across the fork, so nothing else in the five driver files moves:
# FirstPersonMode, FirstPersonConfiguration(b,b,b,b), PlayState, triggerAnimation(id),
# isActive(), getTriggeredAnimation(), stop(), and the layer-id/priority registration shape.
# `setFirstPersonMode`/`setFirstPersonConfiguration` return void here and the controller on
# 1.2.x — source-compatible, because every call site uses them as statements.
deps.pal = "FkO8Scek"

[neoforge."1.21.1"]
# NOT `mod.mc_compat`: that key holds FABRIC range syntax (">=1.21 <=1.21.1") and
# neoforge.mods.toml wants a MAVEN range. The loader-axis nodes therefore get their own key,
# read by build.neoforge.gradle.kts as `${minecraft_range}`. Skill Proficiencies' value for
# the same node, adopted rather than re-derived — the two mods claim the same range.
mod.mc_range = "[1.21,1.21.2)"
# The FLOOR is a real finding and it binds HARDER here than it does next door. Data-attachment
# SYNC arrived in NeoForge 21.1.200. Skill Proficiencies needed it for ONE attachment; this mod
# has 47 synced keys, 16 of them broadcast to every tracking client, and every renderer flag
# other players read rides on them. Below the floor the node builds, loads, and silently shows
# a blank tree screen, a blank cooldown bar and no other player's Bulwark — design R-09's
# failure mode, at 47x. build.neoforge.gradle.kts asserts it at configuration time.
deps.neoforge = "21.1.243"
# PAL, and this is the row design §2.1 wrote the version-ID rule for: `1.1.5` is published on
# BOTH the Fabric and the NeoForge listing of `player-animation-library`, and only the id tells
# them apart. `FkO8Scek` is 1.21.1-fabric's, three keys up; `ReDTdA0C` is this one. Swapping
# them is not a build failure — it is a mis-remapped jar or a jar for the wrong loader.
#
# MEASURED on the cached artifact (scratchpad/pal/ReDTdA0C-…jar): a NeoForge jar, mojmap
# classes, NO `Fabric-Mapping-Namespace` header and no remapper on this node's toolchain
# anyway — so it goes through a PLAIN `compileOnly` plus the dev run's
# `additionalRuntimeClasspath`, not `modImplementation` (there is no such configuration here).
#
# The SOURCE fork it brings is 1.21.1-fabric's, unchanged: this is the same 1.1.x API
# (`IAnimatedPlayer`, `AbstractClientPlayer`), so the `//?` arms the five `*Animations` drivers
# already carry cover this node with no new predicate. Design §5.7's "inherits 1.21.1-fabric's
# 1.1.x source fork" is that sentence.
deps.pal = "ReDTdA0C"

["1.20.1"]
# One release, not a range. 1.20.2 moved `Screen.render`'s background draw and 1.20.5 moved
# the whole component/attachment/payload world, so neither neighbour is covered by this node
# and neither is claimed. Skill Proficiencies' 1.20.1 node makes the same single-version
# claim for the same reason.
mod.mc_releases = ["1.20.1"]

[fabric."1.20.1"]
mod.mc_compat = "1.20.1"
# NOT fabric-api 0.92.11's own floor (`>=0.14.19`), and not this port's 1.21.1 floor either.
# Loader BUNDLES MixinExtras and this repo has 18 MixinExtras injectors including a
# `@WrapMethod` (HealOrHarmMobEffectMixin) that needs >= 0.4.0: 0.15.11 -> 0.3.5,
# 0.16.3 -> 0.4.1. Skill Proficiencies pins its own 1.20.1 node at 0.16.10 and that is
# adopted here rather than re-derived down to 0.16.3 — a player installing the pair should
# not be able to satisfy one mod's floor and not the other's on the same launcher profile.
mod.loader_floor = ">=0.16.10"
deps.fabric_api = "0.92.11+1.20.1"
# NO `deps.pal` KEY, AND THAT ABSENCE IS THE DECISION, not an omission (design §2.2,
# Option B — the decision in force). `player-animation-library` has no artifact for 1.20.1
# on any loader at any version: the project's lowest `game_version` is 1.21.1. The node
# script reads this key with `rawOrNull`, so leaving it out is what drops the dependency,
# the `depends` line in fabric.mod.json (the `strippedMetadataLines` transform) and the five
# animation drivers (whole-unit `//?` gating) together.
#
# Ten animations across five layers go quiet on this node. All ten are cosmetic — every
# driver reads either vanilla's own broadcast swing state or a synced key the server already
# owns, so nothing gates damage, cooldown or resource cost. The loss table is design §2.2.

[forge."1.20.1"]
# Maven range, not Fabric's `mod.mc_compat` syntax — see the note under [neoforge."1.21.1"].
# ONE RELEASE, matching `mod.mc_releases` above and NOT copying Skill Proficiencies'
# `[1.20,1.20.2)`: 1.20.2 moved `Screen.render`'s background draw, so the node's own claim is
# 1.20.1 alone and the metadata says the same thing the Modrinth listing will.
mod.mc_range = "[1.20.1,1.20.2)"
# The version string WITHOUT the `1.20.1-` prefix: build.forge.gradle.kts assembles the
# coordinate as `net.minecraftforge:forge:${sc.current.version}-${deps.forge}`. Architectury
# Loom 1.17.491 + this pin build green next door.
deps.forge = "47.4.22"
# The mods.toml FLOOR is deliberately looser than the compile pin, and this is a lesson the
# other repo learned AFTER shipping: 47.4.22 was latest-at-scoping, not a functional
# requirement, and launcher metas lag the Forge maven — the Modrinth App installs 47.4.20
# today, which would have refused a `[47.4.22,)` mod for no reason. Any Forge 47 (MC 1.20.1)
# works.
deps.forge_floor = "47"
# R-10, AND IT IS MANDATORY HERE RATHER THAN MERELY PRUDENT. LexForge bundles NO MixinExtras —
# measured next door from forge-1.20.1-47.4.22-userdev.jar's own config.json, which lists
# `org.spongepowered:mixin:0.8.5` and zero llamalad7 entries — and this repo has 18 MixinExtras
# injectors: 2 `@WrapMethod`, 3 `@ModifyExpressionValue`, 5 `@WrapOperation`, 8
# `@ModifyReturnValue`, plus `@Local` sugar in the legacy damage hooks. Without the jar-in-jar
# every one of them fails at mixin apply. 0.5.4 is what fabric-loader 0.19.3 bundles, i.e. the
# same library the 26.x nodes run against, so the injector behaviour is one implementation
# across all seven.
deps.mixinextras = "0.5.4"
# NO `deps.pal` KEY, for the same reason the Fabric sibling has none and one more besides:
# `player-animation-library` declares loaders ["fabric","neoforge"] and has no LexForge build
# at ANY Minecraft version. This node inherits 1.20.1-fabric's Option B animation decision
# automatically (design §5.7) — the five `*Animations` drivers are already whole-unit gated on
# the key's absence, so nothing here has to say so twice.
#
# `loom.platform=forge` deliberately does NOT live here: Arch Loom reads it during plugin
# APPLY, which is earlier than Stonecutter's properties exist. It is in
# versions/1.20.1-forge/gradle.properties, the tree's only per-node property file.
