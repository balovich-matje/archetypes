# The 1.20.1-forge node's metadata. Shipped only by this node — build.fabric.gradle.kts and
# build.neoforge.gradle.kts never see this file, because it lives under versions/1.20.1-forge/
# rather than in the shared src/ every node reads.
#
# FILE NAME AND SHAPE VERIFIED against the one LexForge ships for itself:
#   unzip -p forge-1.20.1-47.4.22-universal.jar META-INF/mods.toml
# which gives modLoader / loaderVersion / issueTrackerURL / license / logoFile and a [[mods]]
# block with modId / version / displayName / displayURL / authors / description.
#
# THREE DIFFERENCES FROM THE NEOFORGE NODE'S FILE, all measured, none guessable:
#   1. META-INF/mods.toml, not META-INF/neoforge.mods.toml.
#   2. dependency entries use `mandatory = true/false`, NOT NeoForge's `type = "required"`.
#      Getting this wrong makes the dependency silently OPTIONAL.
#   3. There is NO [[mixins]] table. Forge's own mods.toml has none, and mixin configs are
#      found through the JAR MANIFEST attribute `MixinConfigs` — which is what
#      `loom.forge { mixinConfig(...) }` in build.forge.gradle.kts writes. So the config list
#      lives in the node script, not here.
#
# The placeholders below are filled by the node script's processResources `expand`, from the
# same property map fabric.mod.json gets plus forge_floor and minecraft_range.
#
# CAREFUL WHEN EDITING EVEN THE COMMENTS: `expand` runs this whole file, comments included,
# through Groovy's SimpleTemplateEngine, so a dollar sign here is template syntax and not
# text. A literal dollar-brace in a comment fails the COPY with
# "SimpleTemplateScript1.groovy: Unexpected input: '('", and a bare dollar sign in front of an
# identifier is a missing-property error. Nothing before processResources catches either.

modLoader = "javafml"
# The range is on the javafml LANGUAGE PROVIDER version, which is 47 for the 1.20.1 line
# (MANIFEST of javafmllanguage-1.20.1-47.4.22.jar). Forge's own file says "[24,]" for itself
# because that is the FML version, not the language provider's.
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/balovich-matje/archetypes/issues"
# Read out of the jar rather than assumed: the icon is not at the root here the way Skill
# Proficiencies' is. Forge resolves this path against the mod file, so the assets path is what
# it needs.
logoFile = "assets/archetypes/icon.png"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "balovich-matje"
displayURL = "https://github.com/balovich-matje/archetypes"
description = '''
Pick your class in the first minute. Brawler, Cutpurse or Seeker — and what they become.
'''

# THE EXTERNAL-SKILL REGISTRATION, and on this loader it is one metadata line rather than any
# code at all.
#
# `specialities:skills` is a FABRIC entrypoint and LexForge has no entrypoint concept. Skill
# Proficiencies' answer — recorded in its own ForgePlatform.skillProviders() — is a
# [modproperties] key: it walks ModList.get().getMods(), reads this string off each mod's
# properties and instantiates the named class through its no-arg constructor. Archetypes is the
# first consumer of that surface, so this line is what makes the Spellcasting (mana) skill
# appear in Skill Proficiencies' skills screen on this node.
#
# The KEY is identical on NeoForge, so a mod shipping for both loaders declares it once; the
# 1.21.1-neoforge node's neoforge.mods.toml carries the same pair.
#
# Kept INTERNAL by decision: this is the Archetypes/Skill Proficiencies handshake, not a
# published third-party API — Skill Proficiencies' README is deliberately not edited to
# document it, and that call is the user's.
[modproperties.archetypes]
specialities_skills = "com.archetypes.compat.SpellcastingEntrypoint"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
# Deliberately looser than the compile pin (47.4.22): launcher metas lag the Forge maven, and a
# "[47.4.22,)" mod refuses to install on the 47.4.20 the Modrinth App ships today. Any Forge 47
# is a 1.20.1 Forge.
versionRange = "[${forge_floor},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
# A MAVEN range, not Fabric's `mod.mc_compat` syntax — which is why the loader-axis nodes have
# their own toml key, `mod.mc_range` under [forge."1.20.1"]. One release: 1.20.2 moved
# Screen.render's background draw.
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# Skill Proficiencies is a SOFT dependency — compat/SpecialitiesBridge guards every touch at
# runtime and the mod is fully playable without it — so `mandatory = false`.
#
# `ordering = "NONE"`, AND THAT IS A MEASUREMENT RATHER THAN A DEFAULT. The first draft said
# "AFTER", on the reasoning that the bridge and the [modproperties] scan want Skill
# Proficiencies constructed first. Both reasons were wrong — the bridge is guarded at its first
# CALL, long after construction, and the scan reads this file's metadata plus a reflective
# no-arg constructor, neither of which needs this mod initialised — and the cost was real:
#
# Forge's mod ORDER is Mixin's config-selection order, which is the tiebreak for handlers at
# equal priority. With "AFTER", the damage-funnel export showed Skill Proficiencies' three
# shapers landing ahead of ALL EIGHTEEN of this mod's, where on 1.20.1-fabric they land after
# them; and the two AFTER_DAMAGE handlers swapped as well. Archetypes' shapers are not all pure
# multiplications (design's own R-07 note), so that is a genuine per-node balance divergence,
# not a cosmetic one — the exact class §5.9's cross-mod gate exists to catch.
#
# With "NONE" the export matches 1.20.1-fabric handler for handler. The dependency entry is
# kept, rather than deleted, so the version floor is still declared.
[[dependencies.${id}]]
modId = "specialities"
mandatory = false
versionRange = "[1.6.0,)"
ordering = "NONE"
side = "BOTH"
